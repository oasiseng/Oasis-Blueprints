name: Docs

# Builds the documentation site (docs-site/) and the examples gallery, and publishes them to GitHub Pages.
# On a push to main or a manual run: check, test, build, deploy. On a pull request: everything except
# deploy, so a broken example or page fails the pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the gallery orders examples by when their folder was added

      - name: Check the examples carry placeholders only
        env:
          ANON_DENYLIST: ${{ secrets.ANON_DENYLIST }}
        run: python3 scripts/check_examples.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install Playwright
        run: python -m pip install -r docs-site/requirements.txt
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('docs-site/requirements.txt') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install the site's packages
        working-directory: docs-site
        run: npm ci

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Build, print and audit every example
        run: python scripts/build_examples.py --jobs 4

      - name: Build the site
        working-directory: docs-site
        run: npm run build # runs scripts/docs_prebuild.py first

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
