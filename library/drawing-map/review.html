ural Documents. If a conflict exists, the more stringent governs.", "5. Details labeled \"TYP\" apply to all situations that are the same or similar to those specifically referenced, whether or not they are keyed in at each | location. Questions regarding the applicability of typical details shall be resolved by the Architect.", "6. Openings shown on Structural Drawings are only pictorial. See the Architectural and M.E.P. drawings for the size and location of openings in the | structure.", "7. Contractors who discover discrepancies, omissions or variations in the Contract Documents during bidding shall immediately notify the Architect. | The Architect will resolve the condition and issue a written clarification.", "8. The Contractor shall coordinate all Contract Documents with field conditions and dimensions and Project Shop Drawings prior to construction. Do not scale drawings; use only printed dimensions. Report any discrepancies in writing to the Architect prior to proceeding with work. Do not change size or location of structural members without written instructions from the Structural Engineer of Record.", "9. The Contractor shall protect adjacent property, his own work and the public from harm. The Contractor is solely responsible for construction | means and methods, and jobsite safety including all OSHA requirements.", "10. The Structure is designed to be structurally sound when completed. Prior to completion, the Contractor is responsible for stability and temporary bracing, including, but not limited to, masonry walls. Wherever the Contractor is unsure of these requirements, the Contractor shall retain a {state} Licensed Engineer to design and inspect the temporary bracing and stability of the structure.", "11. For installation of {manufacturer} components and connectors, refer to manufacturer specifications.", "12. Contractor shall exercise extreme caution in areas of buried utilities by calling 811. the contractor is responsible for repairing and contacting all | utilities.", "13. Design Superimposed Loads: | OCCUPANCY/USE Roof Attic Floor Wall Deck", "14. Design Wind Loads | Governing Code Building Risk Category Ultimate Wind Speed Mean Roof Height Directionality Factor Gust-Effect Factor Exposure Internal Pressure Coefficient"]}]}, {"heading": "DESIGN CRITERIA", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 1, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": null}]}, {"heading": "CONCRETE MASONRY", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 11, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Construct masonry in accordance with ACI 530/ASCE 5, \"Building Code Requirements for Concrete Masonry Structures\"; and ACI 530.1/ASCE | 6, \"Specifications for the Design and Construction of Load-Bearing Concrete Masonry\".", "2. The structure is supported by bearing walls, u.o.n. Erect masonry prior to casting concrete columns within bearing walls or casting beams and | slabs supported by bearing walls.", "3. Use 50% solid, nominal 8x8x16, concrete masonry units conforming to ASTM C90. Block net area compressive strength shall be 2,000 psi. | Determine the minimum f'm of 1,500 psi by the unit test method or prism method. Lay up units in running bond. Sawcut units which are not in multiples of 8\". Units shall be at least 8\" long. Bond corners by lapping ends 8\" in successive vertical courses. Design of walls is based on a f'm of 2,000 psi.", "4. Use Type S mortar in accordance with ASTM C270 except use Type M mortar below grade. Head and bed joints shall be 3/8\" for the thickness of the face shell. Webs are to be fully mortared in all courses of piers, columns and pilasters; in the starting course; and where an adjacent cell is to be grouted. Remove mortar protrusions extending 1/2\" or more into cells to be grouted.", "5. Use standard (9 gauge) horizontal joint reinforcing in every other course. Joint reinforcing and anchors in exterior walls shall conform to ASTM | A 153 Class B2, with a coating thickness of 1.50 oz/sf; conform to ASTM A 641 at interior walls. Overlap discontinuous ends 6\". Use prefabricated corners and tees. Use ladder type in walls with vertical reinforcing. Extend joint reinforcing a minimum of 4\" into tie columns.", "6. Use fine grout conforming to ASTM C-476, with a minimum compressive strength of 2,500 psi in 28 days. Aggregate to conform to ASTM C404 | for fine grout, with slump of 8\" to 10\". Grout all masonry containing reinforcing, all cells of 4 hour rated walls, and where indicated on the drawings. Allow mortar to cure 24 hours prior to grouting. Provide cleanout openings at the base of cells containing reinforcing steel to clean the cell and to tie the vertical bar to the dowel.", "7. Use ASTM A-615 Grade 60 reinforcing steel. Reinforce walls where indicated on the drawings and at all intersections, each side of openings and | at the ends of walls. Use bar spacers at 10'-0\" O/C where grout pour height exceeds 10'-0\".", "8. Reinforced masonry wall construction shall be inspected by an Engineer or Architect in accordance with ACI 530.1/ASCE 6.", "9. Where anchor bolts, wedge anchors or anchors set in epoxy are set in a masonry wall, fill cells with grout for bolted course, one course above and | two courses below.", "10. Provide lintels or headers with min. 8\" bearing over all masonry openings.", "11. Use pressure-treated wood for wood in contact with masonry."]}]}, {"heading": "DEMOLITION NOTES", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 8, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. At all locations where new construction will interface with existing elements, cut through existing structure in straight and true lines to insure a | neat interface.", "2. At all locations where the demolition of a concrete member leaves the ends of reinforcing steel exposed, provide the following:", "a. Chip concrete from around the steel to a depth of 1\".", "b. Cut off reinforcing steel not less than 3/4\" below the concrete surface.", "c. Fill the cavity flush with a high modulus gel epoxy. See specifications for accepted manufacturers.", "3. Before demolishing any structural element, install all required temporary and/or permanent bracing and supports.", "4. Provide temporary closure of all roof fascia, wall and other openings to protect building from exposure to undesirable elements until new | construction is weatherproofed, at which time such temporary construction shall be removed. All temporary exterior walls that are subject to wind loads are to be designed by a {state} Licensed Delegated Engineer.", "5. Upon completion of new construction under each phase, all demolished areas shall be restored to acceptable usage according to the contract | documents as determined by the Architect or Engineer."]}]}, {"heading": "STRUCTURAL STEEL", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 10, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Fabricate and erect structural steel in conformance with AISC \"Specification for Structural Steel Buildings\", with Commentary, AISC “Code of Standard Practice for Steel Buildings and Bridges”, AISC “Specification for Structural Joints Using ASTM A325 and A490 Bolts, including Commentary” and all OSHA requirements.", "2. Submit, to the Architect, complete fabrication and erection drawings prepared by or under the direct supervision of a {state} licensed engineer | (Delegated Engineer). Details or connections changed or proposed by the fabricator shall be signed, sealed and dated by the Delegated Engineer.", "3. Fabricate structural steel shapes from the following materials:", "a. Plates: ASTM A36.", "4. All shop and field welding procedures and personnel shall conform to AWS D1.1 Structural Welding Code- Steel. Use E70 series welding | electrodes, u.o.n. Where necessary, remove galvanizing or primer prior to welding.", "5. Cut, drill, or punch holes perpendicular to metal surfaces. Ream holes that must be enlarged to admit bolts as permitted by Architect. Do not | enlarge unfair holes by burning or using drift pins.", "6. Do not splice structural steel members except where indicated on the drawings.", "7. Steel erector to furnish and install temporary bracing as necessary to provide a stable structure during construction.", "8. See Architectural and Mechanical Drawings for miscellaneous steel not shown on the Structural Drawings.", "9. Refer to Architectural Drawings for painting and fireproofing of structural steel. In the absence of other instructions, paint all non-galvanized steel | with a lead and chromate free steel primer. Do not paint steel surfaces in contact with concrete or to be fireproofed."]}]}, {"heading": "SHALLOW FOUNDATIONS", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 2, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. As per visual inspection soil conditions at this site are sand & rock with a min bearing capacity of {year} psf should other conditions or materials be encountered, the engineer shall be notified prior to proceeding with the work the architect or engineer shall supply a letter attesting that the site has been observed and the foundation conditions are similar to those upon which the design is based on.", "2. Center all footings under their respective columns or walls, u.o.n."]}]}, {"heading": "EXCAVATION, BACKFILL AND DEWATERING", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 3, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. The Contractor is solely responsible for all excavation procedures including lagging, shoring, and protection of adjacent property, structures, | streets and utilities in accordance with the requirements of the local building department and OSHA regulations. Do not excavate within one foot of the angle of repose of any soil bearing foundation unless the foundation is properly protected against settlement.", "2. Do not backfill against walls until 7 days after the walls are braced by the structure or are temporarily braced. Do not backfill cantilevered | retaining walls until concrete is 28 days old. Do not backfill until after completion and inspection of any waterproofing.", "3. The Contractor is responsible for the disposal of all accumulated water in a manner that does not inconvenience or damage the work."]}]}, {"heading": "WOOD", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 6, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. All wood construction and connections shall conform to AITC “American Institute of Timber Construction” Manual, and the “National Design | Specifications” for Wood Construction, {year} Edition, and {state} Building Code, Chapter 23.", "2. All member sizes are to be as shown on drawing and provide the following minimum properties: | Member Species | Joists | So. Pine No. 2", "3. All wood in contact with concrete or masonry shall be pressure treated.", "4. All bolts and bolted connections shall conform to ASTM A325, Anchor bolts is F1554-Grade 55. Use washers between wood and all bolt heads | and nuts.", "5. All metal wood connectors shall be galvanized and shall be manufactured by {manufacturer} Co., or approved equal.", "6. All joists shall be laterally supported at ends by solid blocking."]}]}, {"heading": "SLABS-ON-GRADE", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 4, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Above subgrade, use fill containing not more than 10% passing #200 sieve and maximum 1 inch diameter. Compact to 95% of maximum dry | density as determined by modified proctor ASTM D-1557. Each layer of fill shall not exceed 6\" loose thickness. Compact prior to placement of the next layer.", "2. Fill placement and compaction shall be monitored and accepted by the testing agency. Take a min. of one field density test (ASTM D-1556 or | D-2922) for each 2,500 square feet of each layer. The testing agency shall randomly select test locations.", "3. For interior slabs place 10 mil polyethylene sheeting between soil and bottom of slab. Do not use any sheeting below exterior concrete slabs. | Sheets shall be lapped 6” minimum and taped. Seal all penetrations, including pipes, with tape.", "4. See the Architectural Drawings for slab-on-grade depressions and other requirements."]}]}, {"heading": "REINFORCED CONCRETE", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 12, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Provide Structural Concrete and concreting practices complying with ACI 301 and 318.", "2. Provide structural concrete proportioned in accordance with ACI 318, Ch. 5.3, with a minimum ultimate compressive design strength in 28 days | as follows: | Element Footings Slabs-on-Grade | Submit statistical data, not more than one year old, for each class of concrete.", "3. Use normal weight concrete for all structural members. u.o.n.", "4. Aggregates are to be clean, free of chlorides, and complying with ASTM C33 gradations. Maximum coarse aggregate size 1\" (C33 size 57). | Minimum F.M. for fine aggregate is 2.4. Use admixtures conforming to ASTM C494. Provide type A, D, F or G admix in all structural concrete and Type D or G when ambient temperature is 85 degrees or higher. Design concrete, with strengths less than 4500 psi, with 4% +/- 1% entrained air, except for trowel finished floors. Do not use calcium chloride in any concrete.", "5. Obtain composite samples of fresh concrete according to ASTM C172. Obtain at least one composite sample for each 100 cu. yd. or fraction thereof of each concrete mix placed each day. For slabs, increase frequency to each 50 cu. yd. or fraction placed each day. Take a slump test, ASTM C143, for each composite sample. Maximum permissible slump is 5 inches. Cast and laboratory cure one set of four compression test standard cylinders, per ASTM C31, for each composite sample. For pumped concrete, take sample at point of placement. Test, per ASTM C39,", "6. Provide ASTM A-615 Grade 60 reinforcing steel. Reinforcing shall be accurately placed, rigidly supported and firmly tied in place, with", "7. Where specified, provide plain, cold-drawn electrically-welded wire reinforcement conforming to ASTM A-185. Supply in flat sheets only. Lap", "8. Utilities shall not penetrate beams or columns but may pass through slabs and walls individually, u.o.n. For openings 24\" long or less, cut", "9. Where reinforcing steel congestion permits, conduit and pipes up to 1\" diameter may be embedded in concrete per ACI 318, Section 20.7. Space at 3 diameters o.c. Place between outer layers of reinforcing if conduits are significantly congested, additional reinforcing perpendicular to piping may be required. Requests to embed larger pipes should be accompanied by a detailed description and be submitted to the architect for evaluation.", "10. Provide construction joints in accordance with ACI 318, Section 6.4. Provide keyways and adequate dowels. Submit drawings showing location", "11. Provide 3/4\" chamfer for all exposed corners.", "12. Provide reinforcing steel placer with a set of Structural Drawings for field reference. Inspect reinforcing steel placing from structural drawings."]}]}, {"heading": "DEFLECTION DESIGN CRITERIA", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 2, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["All members (beams, slabs, trusses, joists, etc) composing floors have been designed and shall be designed by the delegated engineer for:", "- Total load: Span/240 - Reinforced concrete elements: LL + Long Term Span/380 - Wall / Mullions: L/175 - Stone tile supporting floors LL: Span/380 | Roof members supporting non plaster cellings live: L/240, Total L/180"]}]}, {"heading": "DENOTES {manufacturer} HANGER PER SCHEDULE 4/S2.1, U.O.N", "kind": "schedule", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 1, "on_sheets": ["foundation_plan", "floor_framing_plan", "roof_framing_plan"], "wordings": 1, "variants": [{"sets": 1, "items": null}]}, {"heading": "NOTE", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 4, "on_sheets": ["foundation_plan", "floor_framing_plan", "roof_framing_plan"], "wordings": 1, "variants": [{"sets": 1, "items": ["- STUD PACK FRAMING:", "(4) 2X STUD PACK UNDER EACH END OF SOLID SAWN BEAM. (6) 2X STUD PACK UNDER EACH END OF GLULAM BEAM. (SEE PLAN FOR BEAM SIZE)", "- CONTRACTOR/ OWNER IS RESPONSIBLE FOR THE SOIL / GEOTECH REPORT.", "- CONTRACTOR ADD LOAD BEARING WALL FOOTER BASED ON THE TRUSS MANUFACTURE ENGINEER DESIGN."]}]}, {"heading": "CONCRETE SLAB-ON-GRADE", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 4, "on_sheets": ["details"], "wordings": 1, "variants": [{"sets": 1, "items": null}]}, {"heading": "SHEAR WALL SCHEDULE", "kind": "schedule", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 1, "on_sheets": ["details"], "wordings": 1, "variants": [{"sets": 1, "items": ["\"APA RATED\" 2\" WALL SHEATHING STRUCT 1 | TYPE PER PLAN | 6 | 4 | 3 | 2 | 4 - 4"]}]}, {"heading": "EDGE NAILING (E.N.)", "kind": "notes", "sets": 1, "pct": 100.0, "tier": "core", "items_median": 1, "on_sheets": ["details"], "wordings": 2, "variants": [{"sets": 1, "items": ["BOUNDARY NAILING (B.N.) AT PERIMETER, SAME AS EDGE NAILING, U.O.N. | 4'-0\"x8'-0\" SHEATHING WITH FACE GRAIN PERPENDICULAR TO JOISTS, PLACE IN A STAGGERED JOINT PATTERN, TYP. U.O.N. | 2"]}, {"sets": 1, "items": ["FEILD NAILING (F.N.) EDGE NAILING (E.N.) ALONG ALL S ings": 8, "variants": [{"sets": 4, "items": ["1. The governing Code for this Project is the {year} {state} Building Code, 8th Edition. This Code prescribes which edition of each referenced | standard applies to this Project.", "2. To the best of our knowledge, the Structural Drawings and these Specification Notes comply with the applicable requirements of the governing | Building Code.", "3. Construction is to comply with the requirements of the governing Building Code and all other applicable Federal, State, and Local Codes, | Standards, Regulations and Laws.", "4. The Structural Documents are to be used in conjunction with the Architectural Documents. If a conflict exists, the more stringent governs.", "5. Details labeled \"TYP\" apply to all situations that are the same or similar to those specifically referenced, whether or not they are keyed in at each | location. Questions regarding the applicability of typical details shall be resolved by the Architect.", "6. Openings shown on Structural Drawings are only pictorial. See the Architectural and M.E.P. drawings for the size and location of openings in the | structure.", "7. Contractors who discover discrepancies, omissions or variations in the Contract Documents during bidding shall immediately notify the Architect. | The Architect will resolve the condition and issue a written clarification.", "8. The Contractor shall coordinate all Contract Documents with field conditions and dimensions and Project Shop Drawings prior to construction. Do not scale drawings; use only printed dimensions. Report any discrepancies in writing to the Architect prior to proceeding with work. Do not change size or location of structural members without written instructions from the Structural Engineer of Record.", "9. The Contractor shall protect adjacent property, his own work and the public from harm. The Contractor is solely responsible for construction | means and methods, and jobsite safety including all OSHA requirements.", "10. The Structure is designed to be structurally sound when completed. Prior to completion, the Contractor is responsible for stability and temporary bracing, including, but not limited to, masonry walls. Wherever the Contractor is unsure of these requirements, the Contractor shall retain a {state} Licensed Engineer to design and inspect the temporary bracing and stability of the structure.", "11. For installation of {manufacturer} components and connectors, refer to manufacturer specifications.", "12. Contractor shall exercise extreme caution in areas of buried utilities by calling {company} at {phone}. the contractor is responsible for | repairing and contacting all utilities.", "13. Design Superimposed Loads: | OCCUPANCY/USE Roof Attic Floor Wall Deck", "14. Design Wind Loads | Governing Code Building Risk Category Ultimate Wind Speed Mean Roof Height Directionality Factor Gust-Effect Factor Exposure Internal Pressure Coefficient"]}, {"sets": 1, "items": ["1. ALL WORK PERFORMED SHALL COMPLY WITH THE CONTRACT | DOCUMENTS, DRAWINGS AND SPECIFICATIONS, INCLUDING THESE GENERAL NOTES.", "2. ALL MATERIALS AND WORKMANSHIP SHALL CONFORM TO THE DRAWINGS AND SPECIFICATIONS. IF A CONFLICT IS FOUND BETWEEN DRAWINGS, GENERAL NOTES OR SPECIFICATIONS, CONSULT THE LEAD DESIGNER FOR CLARIFICATION BEFORE PROCEEDING WITH THE WORK", "3. NO DEVIATION FROM DRAWINGS AND SPECIFICATIONS SHALL BE MADE"]}, {"sets": 1, "items": null}, {"sets": 1, "items": ["1) THESE PLANS ARE FOR THE CONSTRUCTION OF NEW RESIDENTIAL STRUCTURE.", "2) INDIVIDUAL CONTRACTORS TO PROVIDE THEIR OWN PLANNING AND"]}]}, {"heading": "CONCRETE MASONRY", "kind": "notes", "sets": 6, "pct": 75.0, "tier": "core", "items_median": 11.0, "on_sheets": ["structural_notes", "other"], "wordings": 2, "variants": [{"sets": 5, "items": ["1. Construct masonry in accordance with ACI 530/ASCE 5, \"Building Code Requirements for Concrete Masonry Structures\"; and ACI 530.1/ASCE | 6, \"Specifications for the Design and Construction of Load-Bearing Concrete Masonry\".", "2. The structure is supported by bearing walls, u.o.n. Erect masonry prior to casting concrete columns within bearing walls or casting beams and | slabs supported by bearing walls.", "3. Use 50% solid, nominal 8x8x16, concrete masonry units conforming to ASTM C90. Block net area compressive strength shall be 2,000 psi. | Determine the minimum f'm of 1,500 psi by the unit test method or prism method. Lay up units in running bond. Sawcut units which are not in multiples of 8\". Units shall be at least 8\" long. Bond corners by lapping ends 8\" in successive vertical courses. Design of walls is based on a f'm of 2,000 psi.", "4. Use Type S mortar in accordance with ASTM C270 except use Type M mortar below grade. Head and bed joints shall be 3/8\" for the thickness of the face shell. Webs are to be fully mortared in all courses of piers, columns and pilasters; in the starting course; and where an adjacent cell is to be grouted. Remove mortar protrusions extending 1/2\" or more into cells to be grouted.", "5. Use standard (9 gauge) horizontal joint reinforcing in every other course. Joint reinforcing and anchors in exterior walls shall conform to ASTM | A 153 Class B2, with a coating thickness of 1.50 oz/sf; conform to ASTM A 641 at interior walls. Overlap discontinuous ends 6\". Use prefabricated corners and tees. Use ladder type in walls with vertical reinforcing. Extend joint reinforcing a minimum of 4\" into tie columns.", "6. Use fine grout conforming to ASTM C-476, with a minimum compressive strength of 2,500 psi in 28 days. Aggregate to conform to ASTM C404 | for fine grout, with slump of 8\" to 10\". Grout all masonry containing reinforcing, all cells of 4 hour rated walls, and where indicated on the drawings. Allow mortar to cure 24 hours prior to grouting. Provide cleanout openings at the base of cells containing reinforcing steel to clean the cell and to tie the vertical bar to the dowel.", "7. Use ASTM A-615 Grade 60 reinforcing steel. Reinforce walls where indicated on the drawings and at all intersections, each side of openings and | at the ends of walls. Use bar spacers at 10'-0\" O/C where grout pour height exceeds 10'-0\".", "8. Reinforced masonry wall construction shall be inspected by an Engineer or Architect in accordance with ACI 530.1/ASCE 6.", "9. Where anchor bolts, wedge anchors or anchors set in epoxy are set in a masonry wall, fill cells with grout for bolted course, one course above and | two courses below.", "10. Provide lintels or headers with min. 8\" bearing over all masonry openings.", "11. Use pressure-treated wood for wood in contact with masonry."]}, {"sets": 1, "items": null}]}, {"heading": "DEMOLITION NOTES", "kind": "notes", "sets": 6, "pct": 75.0, "tier": "core", "items_median": 8.0, "on_sheets": ["structural_notes", "other"], "wordings": 1, "variants": [{"sets": 6, "items": ["1. At all locations where new construction will interface with existing elements, cut through existing structure in straight and true lines to insure a | neat interface.", "2. At all locations where the demolition of a concrete member leaves the ends of reinforcing steel exposed, provide the following:", "a. Chip concrete from around the steel to a depth of 1\".", "b. Cut off reinforcing steel not less than 3/4\" below the concrete surface.", "c. Fill the cavity flush with a high modulus gel epoxy. See specifications for accepted manufacturers.", "3. Before demolishing any structural element, install all required temporary and/or permanent bracing and supports.", "4. Provide temporary closure of all roof fascia, wall and other openings to protect building from exposure to undesirable elements until new | construction is weatherproofed, at which time such temporary construction shall be removed. All temporary exterior walls that are subject to wind loads are to be designed by a {state} Licensed Delegated Engineer.", "5. Upon completion of new construction under each phase, all demolished areas shall be restored to acceptable usage according to the contract | documents as determined by the Architect or Engineer."]}]}, {"heading": "STRUCTURAL STEEL", "kind": "notes", "sets": 6, "pct": 75.0, "tier": "core", "items_median": 10.0, "on_sheets": ["structural_notes", "other"], "wordings": 2, "variants": [{"sets": 5, "items": ["1. Fabricate and erect structural steel in conformance with AISC \"Specification for Structural Steel Buildings\", with Commentary, AISC “Code of Standard Practice for Steel Buildings and Bridges”, AISC “Specification for Structural Joints Using ASTM A325 and A490 Bolts, including Commentary” and all OSHA requirements.", "2. Submit, to the Architect, complete fabrication and erection drawings prepared by or under the direct supervision of a {state} licensed engineer | (Delegated Engineer). Details or connections changed or proposed by the fabricator shall be signed, sealed and dated by the Delegated Engineer.", "3. Fabricate structural steel shapes from the following materials:", "a. Plates: ASTM A36.", "4. All shop and field welding procedures and personnel shall conform to AWS D1.1 Structural Welding Code- Steel. Use E70 series welding | electrodes, u.o.n. Where necessary, remove galvanizing or primer prior to welding.", "5. Cut, drill, or punch holes perpendicular to metal surfaces. Ream holes that must be enlarged to admit bolts as permitted by Architect. Do not | enlarge unfair holes by burning or using drift pins.", "6. Do not splice structural steel members except where indicated on the drawings.", "7. Steel erector to furnish and install temporary bracing as necessary to provide a stable structure during construction.", "8. See Architectural and Mechanical Drawings for miscellaneous steel not shown on the Structural Drawings.", "9. Refer to Architectural Drawings for painting and fireproofing of structural steel. In the absence of other instructions, paint all non-galvanized steel | with a lead and chromate free steel primer. Do not paint steel surfaces in contact with concrete or to be fireproofed."]}, {"sets": 1, "items": ["1. Fabricate and erect structural steel in conformance with AISC \"Specification for Structural Steel Buildings\", with Commentary, | AISC “Code of Standard Practice for Steel Buildings and Bridges”, AISC “Specification for Structural Joints Using ASTM A325 and A490 Bolts, including Commentary” and all OSHA requirements.", "2. Submit, to the Architect, complete fabrication and erection drawings prepared by or under the direct supervision of a {state} | licensed engineer (Delegated Engineer). Details or connections changed or proposed by the fabricator shall be signed, sealed and dated by the Delegated Engineer.", "3. Fabricate structural steel shapes from the following materials: | HSS Shapes W Shapes Continuity Plates Other Shapes And Plates Electrodes Base Plates", "4. All shop and field welding procedures and personnel shall conform to AWS D1.1 Structural Welding Code- Steel. Use E70 series | welding electrodes, u.o.n. Where necessary, remove galvanizing or primer prior to welding.", "5. Cut, drill, or punch holes perpendicular to metal surfaces. Ream holes that must be enlarged to admit bolts as permitted by | Architect. Do not enlarge unfair holes by burning or using drift pins.", "6. Do not splice structural steel members except where indicated on the drawings.", "7. Steel erector to furnish and install temporary bracing as necessary to provide a stable structure during construction.", "8. See Architectural and Mechanical Drawings for miscellaneous steel not shown on the Structural Drawings.", "9. Refer to Architectural Drawings for painting and fireproofing of structural steel. In the absence of other instructions, paint all non-galvanized steel with a lead and chromate free steel primer. Do not paint steel surfaces in contact with concrete or to be fireproofed."]}]}, {"heading": "SHALLOW FOUNDATIONS", "kind": "notes", "sets": 6, "pct": 75.0, "tier": "core", "items_median": 2.0, "on_sheets": ["structural_notes", "other"], "wordings": 2, "variants": [{"sets": 5, "items": ["1. As per visual inspection soil conditions at this site are sand & rock with a min bearing capacity of {year} psf should other conditions or materials be encountered, the engineer shall be notified prior to proceeding with the work the architect or engineer shall supply a letter attesting that the site has been observed and the foundation conditions are similar to those upon which the design is based on.", "2. Center all footings under their respective columns or walls, u.o.n."]}, {"sets": 1, "items": null}]}, {"heading": "EXCAVATION, BACKFILL AND DEWATERING", "kind": "notes", "sets": 6, "pct": 75.0, "tier": "core", "items_median": 3.0, "on_sheets": ["structural_notes", "other"], "wordings": 1, "variants": [{"sets": 6, "items": ["1. The Contractor is solely responsible for all excavation procedures including lagging, shoring, and protection of adjacent property, structures, | streets and utilities in accordance with the requirements of the local building department and OSHA regulations. Do not excavate within one foot of the angle of repose of any soil bearing foundation unless the foundation is properly protected against settlement.", "2. Do not backfill against walls until 7 days after the walls are braced by the structure or are temporarily braced. Do not backfill cantilevered | retaining walls until concrete is 28 days old. Do not backfill until after completion and inspection of any waterproofing.", "3. The Contractor is responsible for the disposal of all accumulated water in a manner that does not inconvenience or damage the work."]}]}, {"heading": "WOOD", "kind": "notes", "sets": 6, "pct": 75.0, "tier": "core", "items_median": 6.0, "on_sheets": ["structural_notes", "other"], "wordings": 3, "variants": [{"sets": 3, "items": ["1. All wood construction and connections shall conform to AITC “American Institute of Timber Construction” Manual, and the 3, "tier": "common", "position": 0.333, "sheets_per_set": 2, "numbering": [], "names": [], "views": []}, {"kind": "elevations", "name": "Elevations", "sets": 3, "pct": 100.0, "tier": "core", "position": 0.364, "sheets_per_set": 2, "numbering": [["A", 3]], "names": [["ELEVATIONS", 2], ["FRONT ELEVATION", 1]], "views": []}, {"kind": "details", "name": "Details", "sets": 2, "pct": 66.7, "tier": "core", "position": 0.409, "sheets_per_set": 4.5, "numbering": [["S", 4]], "names": [["STRUCTURAL DETAILS", 3]], "views": []}, {"kind": "floor_framing_plan", "name": "Floor or deck framing plan", "sets": 2, "pct": 66.7, "tier": "core", "position": 0.429, "sheets_per_set": 2.0, "numbering": [["S", 1]], "names": [["FOUNDATION & FLOOR FRAMING PLAN", 1]], "views": []}, {"kind": "structural_notes", "name": "Structural notes", "sets": 1, "pct": 33.3, "tier": "common", "position": 0.545, "sheets_per_set": 1, "numbering": [["S", 1]], "names": [["STRUCTURAL NOTES", 1]], "views": []}, {"kind": "foundation_plan", "name": "Foundation plan", "sets": 1, "pct": 33.3, "tier": "common", "position": 0.636, "sheets_per_set": 1, "numbering": [["S", 1]], "names": [["FOUNDATION & FLOOR FRAMING PLAN", 1]], "views": []}, {"kind": "view_3d", "name": "3D view", "sets": 1, "pct": 33.3, "tier": "common", "position": 0.667, "sheets_per_set": 1, "numbering": [], "names": [], "views": []}, {"kind": "roof_framing_plan", "name": "Roof framing plan", "sets": 2, "pct": 66.7, "tier": "core", "position": 0.753, "sheets_per_set": 1.0, "numbering": [["S", 1]], "names": [["ROOF FRAMING PLAN", 1]], "views": []}, {"kind": "legend", "name": "Legend", "sets": 1, "pct": 33.3, "tier": "common", "position": 0.875, "sheets_per_set": 2, "numbering": [["E", 1], ["P", 1]], "names": [["SYMBOL LEGEND", 2]], "views": []}, {"kind": "sections", "name": "Sections", "sets": 1, "pct": 33.3, "tier": "common", "position": 1.0, "sheets_per_set": 1, "numbering": [], "names": [], "views": []}], "details": [], "notes": [{"heading": "GENERAL NOTES", "kind": "notes", "sets": 2, "pct": 66.7, "tier": "core", "items_median": 2.0, "on_sheets": ["cover", "site_plan", "roof_plan"], "wordings": 5, "variants": [{"sets": 1, "items": ["1. ALL WORK PERFORMED SHALL COMPLY WITH THE CONTRACT | DOCUMENTS, DRAWINGS AND SPECIFICATIONS, INCLUDING THESE GENERAL NOTES.", "2. ALL MATERIALS AND WORKMANSHIP SHALL CONFORM TO THE DRAWINGS AND SPECIFICATIONS. IF A CONFLICT IS FOUND BETWEEN DRAWINGS, GENERAL NOTES OR SPECIFICATIONS, CONSULT THE LEAD DESIGNER FOR CLARIFICATION BEFORE PROCEEDING WITH THE WORK", "3. NO DEVIATION FROM DRAWINGS AND SPECIFICATIONS SHALL BE MADE"]}, {"sets": 1, "items": ["1) THESE PLANS ARE FOR THE CONSTRUCTION OF NEW RESIDENTIAL STRUCTURE.", "2) INDIVIDUAL CONTRACTORS TO PROVIDE THEIR OWN PLANNING AND"]}, {"sets": 1, "items": null}, {"sets": 1, "items": ["1. The governing Code for this Project is the {year} {state} Building Code, 8th Edition. This Code prescribes which edition of each referenced | standard applies to this Project.", "2. To the best of our knowledge, the Structural Drawings and these Specification Notes comply with the applicable requirements of the governing | Building Code.", "3. Construction is to comply with the requirements of the governing Building Code and all other applicable Federal, State, and Local Codes, | Standards, Regulations and Laws.", "4. The Structural Documents are to be used in conjunction with the Architectural Documents. If a conflict exists, the more stringent governs.", "5. Details labeled \"TYP\" apply to all situations that are the same or similar to those specifically referenced, whether or not they are keyed in at each | location. Questions regarding the applicability of typical details shall be resolved by the Architect.", "6. Openings shown on Structural Drawings are only pictorial. See the Architectural and M.E.P. drawings for the size and location of openings in the | structure.", "7. Contractors who discover discrepancies, omissions or variations in the Contract Documents during bidding shall immediately notify the Architect. | The Architect will resolve the condition and issue a written clarification.", "8. The Contractor shall coordinate all Contract Documents with field conditions and dimensions and Project Shop Drawings prior to construction. Do not scale drawings; use only printed dimensions. Report any discrepancies in writing to the Architect prior to proceeding with work. Do not change size or location of structural members without written instructions from the Structural Engineer of Record.", "9. The Contractor shall protect adjacent property, his own work and the public from harm. The Contractor is solely responsible for construction | means and methods, and jobsite safety including all OSHA requirements.", "10. The Structure is designed to be structurally sound when completed. Prior to completion, the Contractor is responsible for stability and temporary bracing, including, but not limited to, masonry walls. Wherever the Contractor is unsure of these requirements, the Contractor shall retain a {state} Licensed Engineer to design and inspect the temporary bracing and stability of the structure.", "11. For installation of {manufacturer} components and connectors, refer to manufacturer specifications.", "12. Contractor shall exercise extreme caution in areas of buried utilities by calling {company} at {phone}. the contractor is responsible for | repairing and contacting all utilities.", "13. Design Superimposed Loads: | OCCUPANCY/USE Roof Attic Floor Wall Deck", "14. Design Wind Loads | Governing Code Building Risk Category Ultimate Wind Speed Mean Roof Height Directionality Factor Gust-Effect Factor Exposure Internal Pressure Coefficient"]}]}, {"heading": "CONCRETE SLAB-ON-GRADE", "kind": "notes", "sets": 2, "pct": 66.7, "tier": "core", "items_median": 2.5, "on_sheets": ["details", "other"], "wordings": 2, "variants": [{"sets": 1, "items": ["6mm MIN. VAPOR BARRIER ({manufacturer} WRAP OR EQUIVALENT) AT INTERIOR CONDITIONS, S.A.D. | \" 4", "1. 2. 3. 4. 5. 6. 7. 8.", "2. 3. 4. WALL SHEATHING SHALL BE APPLIED OVER STUDS SPACED AT 16\"o.c. ALL SILL FASTENING TO CONCRETE SHALL HAVE AS A MINIMUM 5 5. SHALL EXTEND TO WITHIN 1 NAILS PENETRATING PRESSURE TREATED WOOD SHALL BE HOT-DIPPED GALVANIZED PER ASTM A153, CLASS D. DBL. 2x STUDS AT ABUTTING PANEL EDGES SHALL BE FASTENED TOGETHER w/ 16d NAILS AT EDGE NAIL SPACING. NAILING SPACED AT 3\"o.c. OR LESS SHALL BE STAGGERED 1", "6. 7. 8."]}, {"sets": 1, "items": ["6mm MIN. VAPOR BARRIER ({manufacturer} WRAP OR EQUIVALENT) AT INTERIOR CONDITIONS, S.A.D. | \" 4"]}]}, {"heading": "CODE / AUTHORITY", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 1, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": null}]}, {"heading": "SYMBOLS & LEGENDS", "kind": "legend", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 1, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": ["FLOOR LEVEL 0' - 0\" | 1 | A | ROOM NAME - | - | - | - | 1 | A.3 | 3 S2.0 | A | D | C"]}]}, {"heading": "SECTION CUT MARKER", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 4, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": ["DIRECTION OF CUT SECTION DRAWING NUMBER SECTION DRAWING SHEET NUMBER", "4. FIRE PROTECTION EQUIPMENT AND SERVICE ACCESS MUST BE PROVIDED DURING THE CONSTRUCTION PERIOD OR AS REQUIRED BY THE CITY FIRE DEPARTMENT", "5. BUILDER SHALL MAINTAIN CLEAR EXIT(S) AND TEMPORARY EXIT SIGNS TO", "6. ALL APPLICABLE CODE DESIGNATIONS SHALL COMPLY WITH THE MOST"]}]}, {"heading": "NOTE OR NOTATION", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 1, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": ["AN ARCHITECTURAL SHEET OR SCHEDULE INDICATES THAT DIMENSIONS PROVIDED ELSEWHERE SHALL GOVERN"]}]}, {"heading": "DESIGN CRITERIA", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 1, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": null}]}, {"heading": "CONCRETE MASONRY", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 11, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Construct masonry in accordance with ACI 530/ASCE 5, \"Building Code Requirements for Concrete Masonry Structures\"; and ACI 530.1/ASCE | 6, \"Specifications for the Design and Construction of Load-Bearing Concrete Masonry\".", "2. The structure is supported by bearing walls, u.o.n. Erect masonry prior to casting concrete columns within bearing walls or casting beams and | slabs supported by bearing walls.", "3. Use 50% solid, nominal 8x8x16, concrete masonry units conforming to ASTM C90. Block net area compressive strength shall be 2,000 psi. | Determine the minimum f'm of 1,500 psi by the unit test method or prism method. Lay up units in running bond. Sawcut units which are not in multiples of 8\". Units shall be at least 8\" long. Bond corners by lapping ends 8\" in successive vertical courses. Design of walls is based on a f'm of 2,000 psi.", "4. Use Type S mortar in accordance with ASTM C270 except use Type M mortar below grade. Head and bed joints shall be 3/8\" for the thickness of the face shell. Webs are to be fully mortared in all courses of piers, columns and pilasters; in the starting course; and where an adjacent cell is to be grouted. Remove mortar protrusions extending 1/2\" or more into cells to be grouted.", "5. Use standard (9 gauge) horizontal joint reinforcing in every other course. Joint reinforcing and anchors in exterior walls shall conform to ASTM | A 153 Class B2, with a coating thickness of 1.50 oz/sf; conform to ASTM A 641 at interior walls. Overlap discontinuous ends 6\". Use prefabricated corners and tees. Use ladder type in walls with vertical reinforcing. Extend joint reinforcing a minimum of 4\" into tie columns.", "6. Use fine grout conforming to ASTM C-476, with a minimum compressive strength of 2,500 psi in 28 days. Aggregate to conform to ASTM C404 | for fine grout, with slump of 8\" to 10\". Grout all masonry containing reinforcing, all cells of 4 hour rated walls, and where indicated on the drawings. Allow mortar to cure 24 hours prior to grouting. Provide cleanout openings at the base of cells containing reinforcing steel to clean the cell and to tie the vertical bar to the dowel.", "7. Use ASTM A-615 Grade 60 reinforcing steel. Reinforce walls where indicated on the drawings and at all intersections, each side of openings and | at the ends of walls. Use bar spacers at 10'-0\" O/C where grout pour height exceeds 10'-0\".", "8. Reinforced masonry wall construction shall be inspected by an Engineer or Architect in accordance with ACI 530.1/ASCE 6.", "9. Where anchor bolts, wedge anchors or anchors set in epoxy are set in a masonry wall, fill cells with grout for bolted course, one course above and | two courses below.", "10. Provide lintels or headers with min. 8\" bearing over all masonry openings.", "11. Use pressure-treated wood for wood in contact with masonry."]}]}, {"heading": "DEMOLITION NOTES", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 8, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. At all locations where new construction will interface with existing elements, cut through existing structure in straight and true lines to insure a | neat interface.", "2. At all locations where the demolition of a concrete member leaves the ends of reinforcing steel exposed, provide the following:", "a. Chip concrete from around the steel to a depth of 1\".", "b. Cut off reinforcing steel not less than 3/4\" below the concrete surface.", "c. Fill the cavity flush with a high modulus gel epoxy. See specifications for accepted manufacturers.", "3. Before demolishing any structural element, install all required temporary and/or permanent bracing and supports.", "4. Provide temporary closure of all roof fascia, wall and other openings to protect building from exposure to undesirable elements until new | construction is weatherproofed, at which time such temporary construction shall be removed. All temporary exterior walls that are subject to wind loads are to be designed by a {state} Licensed Delegated Engineer.", "5. Upon completion of new construction under each phase, all demolished areas shall be restored to acceptable usage according to the contract | documents as determined by the Architect or Engineer."]}]}, {"heading": "STRUCTURAL STEEL", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 10, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Fabricate and erect structural steel in conformance with AISC \"Specification for Structural Steel Buildings\", with Commentary, AISC “Code of Standard Practice for Steel Buildings and Bridges”, AISC “Specification for Structural Joints Using ASTM A325 and A490 Bolts, including Commentary” and all OSHA requirements.", "2. Submit, to the Architect, complete fabrication and erection drawings prepared by or under the direct supervision of a {state} licensed engineer | (Delegated Engineer). Details or connections changed or proposed by the fabricator shall be signed, sealed and dated by the Delegated Engineer.", "3. Fabricate structural steel shapes from the following materials:", "a. Plates: ASTM A36.", "4. All shop and field welding procedures and personnel shall conform to AWS D1.1 Structural Welding Code- Steel. Use E70 series welding | electrodes, u.o.n. Where necessary, remove galvanizing or primer prior to welding.", "5. Cut, drill, or punch holes perpendicular to metal surfaces. Ream holes that must be enlarged to admit bolts as permitted by Architect. Do not | enlarge unfair holes by burning or using drift pins.", "6. Do not splice structural steel members except where indicated on the drawings.", "7. Steel erector to furnish and install temporary bracing as necessary to provide a stable structure during construction.", "8. See Architectural and Mechanical Drawings for miscellaneous steel not shown on the Structural Drawings.", "9. Refer to Architectural Drawings for painting and fireproofing of structural steel. In the absence of other instructions, paint all non-galvanized steel | with a lead and chromate free steel primer. Do not paint steel surfaces in contact with concrete or to be fireproofed."]}]}, {"heading": "SHALLOW FOUNDATIONS", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 2, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. As per visual inspection soil conditions at this site are sand & rock with a min bearing capacity of {year} psf should other conditions or materials be encountered, the engineer shall be notified prior to proceeding with the work the architect or engineer shall supply a letter attesting that the site has been observed and the foundation conditions are similar to those upon which the design is based on.", "2. Center all footings under their respective columns or walls, u.o.n."]}]}, {"heading": "EXCAVATION, BACKFILL AND DEWATERING", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 3, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. The Contractor is solely responsible for all excavation procedures including lagging, shoring, and protection of adjacent property, structures, | streets and utilities in accordance with the requirements of the local building department and OSHA regulations. Do not excavate within one foot of the angle of repose of any soil bearing foundation unless the foundation is properly protected against settlement.", "2. Do not backfill against walls until 7 days after the walls are braced by the structure or are temporarily braced. Do not backfill cantilevered | retaining walls until concrete is 28 days old. Do not backfill until after completion and inspection of any waterproofing.", "3. The Contractor is responsible for the disposal of all accumulated water in a manner that does not inconvenience or damage the work."]}]}, {"heading": "WOOD", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 6, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. All wood construction and connections shall conform to AITC “American Institute of Timber Construction” Manual, and the “National Design | Specifications” for Wood Construction, {year} Edition, and {state} Building Code, Chapter 23.", "2. All member sizes are to be as shown on drawing and provide the following minimum properties: | Member Species | Joists | So. Pine No. 2", "3. All wood in contact with concrete or masonry shall be pressure treated.", "4. All bolts and bolted connections shall conform to ASTM A325, Anchor bolts is F1554-Grade 55. Use washers between wood and all bolt heads | and nuts.", "5. All metal wood connectors shall be galvanized and shall be manufactured by {manufacturer} Co., or approved equal.", "6. All joists shall be laterally supported at ends by solid blocking."]}]}, {"heading": "SLABS-ON-GRADE", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 4, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Above subgrade, use fill containing not more than 10% passing #200 sieve and maximum 1 inch diameter. Compact to 95% of maximum dry | density as determined by modified proctor ASTM D-1557. Each layer of fill shall not exceed 6\" loose thickness. Compact prior to placement of the next layer.", "2. Fill placement and compaction shall be monitored and accepted by the testing agency. Take a min. of one field density test (ASTM D-1556 or | D-2922) for each 2,500 square feet of each layer. The testing agency shall randomly select test locations.", "3. For interior slabs place 10 mil polyethylene sheeting between soil and bottom of slab. Do not use any sheeting below exterior concrete slabs. | Sheets shall be lapped 6” minimum and taped. Seal all penetrations, including pipes, with tape.", "4. See the Architectural Drawings for slab-on-grade depressions and other requirements."]}]}, {"heading": "REINFORCED CONCRETE", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 12, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Provide Structural Concrete and concreting practices complying with ACI 301 and 318.", "2. Provide structural concrete proportioned in accordance with ACI 318, Ch. 5.3, with a minimum ultimate compressive design strength in 28 days | as follows: | Element Footings Slabs-on-Grade | Submit statistical data, not more than one year old, for each class of concrete.", "3. Use normal weight concrete for all structural members. u.o.n.", "4. Aggregates are to be clean, free of chlorides, and complying with ASTM C33 gradations. Maximum coarse aggregate size 1\" (C33 size 57). | Minimum F.M. for fine aggregate is 2.4. Use admixtures conforming to ASTM C494. Provide type A, D, F or G admix in all structural concrete and Type D or G when ambient temperature is 85 degrees or higher. Design concrete, with strengths less than 4500 psi, with 4% +/- 1% entrained air, except for trowel finished floors. Do not use calcium chloride in any concrete.", "5. Obtain composite samples of fresh concrete according to ASTM C172. Obtain at least one composite sample for each 100 cu. yd. or fraction thereof of each concrete mix placed each day. For slabs, increase frequency to each 50 cu. yd. or fraction placed each day. Take a slump test, ASTM C143, for each composite sample. Maximum permissible slump is 5 inches. Cast and laboratory cure one set of four compression test standard cylinders, per ASTM C31, for each composite sample. For pumped concrete, take sample at point of placement. Test, per ASTM C39,", "6. Provide ASTM A-615 Grade 60 reinforcing steel. Reinforcing shall be accurately placed, rigidly supported and firmly tied in place, with", "7. Where specified, provide plain, cold-drawn electrically-welded wire reinforcement conforming to ASTM A-185. Supply in flat sheets only. Lap", "8. Utilities shall not penetrate beams or columns but may pass through slabs and walls individually, u.o.n. For openings 24\" long or less, cut", "9. Where reinforcing steel congestion permits, conduit and pipes up to 1\" diameter may be embedded in concrete per ACI 318, Section 20.7. Space at 3 diameters o.c. Place between outer layers of reinforcing if conduits are significantly congested, additional reinforcing perpendicular to piping may be required. Requests to embed larger pipes should be accompanied by a detailed description and be submitted to the architect for evaluation.", "10. Provide construction joints in accordance with ACI 318, Section 6.4. Provide keyways and adequate dowels. Submit drawings showing location", "11. Provide 3/4\" chamfer for all exposed corners.", "12. Provide reinforcing steel placer with a set of Structural Drawings for field reference. Inspect reinforcing steel placing from structural drawings."]}]}, {"heading": "DENOTES {manufacturer} HANGER PER SCHEDULE 4/S2.1, U.O.N", "kind": "schedule", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 1, "on_sheets": ["foundation_plan", "roof_framing_plan"], "wordings": 1, "variants": [{"sets": 1, "items": ["DENOTES {manufacturer} CONCEALED FLANGE HANGER PER SCHEDULE 4/S2.1, U.O.N. | SEE HEADER SCHEDULE ON 8/S2.1 FOR HEADER SIZES, UNLESS NOTED ON PLAN. | 15\" WIDE x 18\" CONCRETE FOOTING, U.O.N."]}]}, {"heading": "NOTE", "kind": "notes", "sets": 1, "pct": 33.3, "tier": "common", "items_median": 3, "on_sheets": ["foundation_plan", "roof_framing_plan"], "wordings": 1, "variants": [{"sets": 1, "items": ["- STUD PACK FRAMING:", "(4) 2X STUD PACK UNDER -GRADE", "kind": "notes", "sets": 2, "pct": 100.0, "tier": "core", "items_median": 2.5, "on_sheets": ["details", "other"], "wordings": 2, "variants": [{"sets": 1, "items": ["6mm MIN. VAPOR BARRIER ({manufacturer} WRAP OR EQUIVALENT) AT INTERIOR CONDITIONS, S.A.D. | \" 4", "1. 2. 3. 4. 5. 6. 7. 8.", "2. 3. 4. WALL SHEATHING SHALL BE APPLIED OVER STUDS SPACED AT 16\"o.c. ALL SILL FASTENING TO CONCRETE SHALL HAVE AS A MINIMUM 5 5. SHALL EXTEND TO WITHIN 1 NAILS PENETRATING PRESSURE TREATED WOOD SHALL BE HOT-DIPPED GALVANIZED PER ASTM A153, CLASS D. DBL. 2x STUDS AT ABUTTING PANEL EDGES SHALL BE FASTENED TOGETHER w/ 16d NAILS AT EDGE NAIL SPACING. NAILING SPACED AT 3\"o.c. OR LESS SHALL BE STAGGERED 1", "6. 7. 8."]}, {"sets": 1, "items": ["6mm MIN. VAPOR BARRIER ({manufacturer} WRAP OR EQUIVALENT) AT INTERIOR CONDITIONS, S.A.D. | \" 4"]}]}, {"heading": "GENERAL NOTES", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 3, "on_sheets": ["cover", "site_plan", "roof_plan"], "wordings": 4, "variants": [{"sets": 1, "items": ["1. ALL WORK PERFORMED SHALL COMPLY WITH THE CONTRACT | DOCUMENTS, DRAWINGS AND SPECIFICATIONS, INCLUDING THESE GENERAL NOTES.", "2. ALL MATERIALS AND WORKMANSHIP SHALL CONFORM TO THE DRAWINGS AND SPECIFICATIONS. IF A CONFLICT IS FOUND BETWEEN DRAWINGS, GENERAL NOTES OR SPECIFICATIONS, CONSULT THE LEAD DESIGNER FOR CLARIFICATION BEFORE PROCEEDING WITH THE WORK", "3. NO DEVIATION FROM DRAWINGS AND SPECIFICATIONS SHALL BE MADE"]}, {"sets": 1, "items": ["1) THESE PLANS ARE FOR THE CONSTRUCTION OF NEW RESIDENTIAL STRUCTURE.", "2) INDIVIDUAL CONTRACTORS TO PROVIDE THEIR OWN PLANNING AND"]}, {"sets": 1, "items": null}, {"sets": 1, "items": ["1. The governing Code for this Project is the {year} {state} Building Code, 8th Edition. This Code prescribes which edition of each referenced | standard applies to this Project.", "2. To the best of our knowledge, the Structural Drawings and these Specification Notes comply with the applicable requirements of the governing | Building Code.", "3. Construction is to comply with the requirements of the governing Building Code and all other applicable Federal, State, and Local Codes, | Standards, Regulations and Laws.", "4. The Structural Documents are to be used in conjunction with the Architectural Documents. If a conflict exists, the more stringent governs.", "5. Details labeled \"TYP\" apply to all situations that are the same or similar to those specifically referenced, whether or not they are keyed in at each | location. Questions regarding the applicability of typical details shall be resolved by the Architect.", "6. Openings shown on Structural Drawings are only pictorial. See the Architectural and M.E.P. drawings for the size and location of openings in the | structure.", "7. Contractors who discover discrepancies, omissions or variations in the Contract Documents during bidding shall immediately notify the Architect. | The Architect will resolve the condition and issue a written clarification.", "8. The Contractor shall coordinate all Contract Documents with field conditions and dimensions and Project Shop Drawings prior to construction. Do not scale drawings; use only printed dimensions. Report any discrepancies in writing to the Architect prior to proceeding with work. Do not change size or location of structural members without written instructions from the Structural Engineer of Record.", "9. The Contractor shall protect adjacent property, his own work and the public from harm. The Contractor is solely responsible for construction | means and methods, and jobsite safety including all OSHA requirements.", "10. The Structure is designed to be structurally sound when completed. Prior to completion, the Contractor is responsible for stability and temporary bracing, including, but not limited to, masonry walls. Wherever the Contractor is unsure of these requirements, the Contractor shall retain a {state} Licensed Engineer to design and inspect the temporary bracing and stability of the structure.", "11. For installation of {manufacturer} components and connectors, refer to manufacturer specifications.", "12. Contractor shall exercise extreme caution in areas of buried utilities by calling {company} at {phone}. the contractor is responsible for | repairing and contacting all utilities.", "13. Design Superimposed Loads: | OCCUPANCY/USE Roof Attic Floor Wall Deck", "14. Design Wind Loads | Governing Code Building Risk Category Ultimate Wind Speed Mean Roof Height Directionality Factor Gust-Effect Factor Exposure Internal Pressure Coefficient"]}]}, {"heading": "CODE / AUTHORITY", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 1, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": null}]}, {"heading": "SYMBOLS & LEGENDS", "kind": "legend", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 1, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": ["FLOOR LEVEL 0' - 0\" | 1 | A | ROOM NAME - | - | - | - | 1 | A.3 | 3 S2.0 | A | D | C"]}]}, {"heading": "SECTION CUT MARKER", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 4, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": ["DIRECTION OF CUT SECTION DRAWING NUMBER SECTION DRAWING SHEET NUMBER", "4. FIRE PROTECTION EQUIPMENT AND SERVICE ACCESS MUST BE PROVIDED DURING THE CONSTRUCTION PERIOD OR AS REQUIRED BY THE CITY FIRE DEPARTMENT", "5. BUILDER SHALL MAINTAIN CLEAR EXIT(S) AND TEMPORARY EXIT SIGNS TO", "6. ALL APPLICABLE CODE DESIGNATIONS SHALL COMPLY WITH THE MOST"]}]}, {"heading": "NOTE OR NOTATION", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 1, "on_sheets": ["cover"], "wordings": 1, "variants": [{"sets": 1, "items": ["AN ARCHITECTURAL SHEET OR SCHEDULE INDICATES THAT DIMENSIONS PROVIDED ELSEWHERE SHALL GOVERN"]}]}, {"heading": "DESIGN CRITERIA", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 1, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": null}]}, {"heading": "CONCRETE MASONRY", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 11, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Construct masonry in accordance with ACI 530/ASCE 5, \"Building Code Requirements for Concrete Masonry Structures\"; and ACI 530.1/ASCE | 6, \"Specifications for the Design and Construction of Load-Bearing Concrete Masonry\".", "2. The structure is supported by bearing walls, u.o.n. Erect masonry prior to casting concrete columns within bearing walls or casting beams and | slabs supported by bearing walls.", "3. Use 50% solid, nominal 8x8x16, concrete masonry units conforming to ASTM C90. Block net area compressive strength shall be 2,000 psi. | Determine the minimum f'm of 1,500 psi by the unit test method or prism method. Lay up units in running bond. Sawcut units which are not in multiples of 8\". Units shall be at least 8\" long. Bond corners by lapping ends 8\" in successive vertical courses. Design of walls is based on a f'm of 2,000 psi.", "4. Use Type S mortar in accordance with ASTM C270 except use Type M mortar below grade. Head and bed joints shall be 3/8\" for the thickness of the face shell. Webs are to be fully mortared in all courses of piers, columns and pilasters; in the starting course; and where an adjacent cell is to be grouted. Remove mortar protrusions extending 1/2\" or more into cells to be grouted.", "5. Use standard (9 gauge) horizontal joint reinforcing in every other course. Joint reinforcing and anchors in exterior walls shall conform to ASTM | A 153 Class B2, with a coating thickness of 1.50 oz/sf; conform to ASTM A 641 at interior walls. Overlap discontinuous ends 6\". Use prefabricated corners and tees. Use ladder type in walls with vertical reinforcing. Extend joint reinforcing a minimum of 4\" into tie columns.", "6. Use fine grout conforming to ASTM C-476, with a minimum compressive strength of 2,500 psi in 28 days. Aggregate to conform to ASTM C404 | for fine grout, with slump of 8\" to 10\". Grout all masonry containing reinforcing, all cells of 4 hour rated walls, and where indicated on the drawings. Allow mortar to cure 24 hours prior to grouting. Provide cleanout openings at the base of cells containing reinforcing steel to clean the cell and to tie the vertical bar to the dowel.", "7. Use ASTM A-615 Grade 60 reinforcing steel. Reinforce walls where indicated on the drawings and at all intersections, each side of openings and | at the ends of walls. Use bar spacers at 10'-0\" O/C where grout pour height exceeds 10'-0\".", "8. Reinforced masonry wall construction shall be inspected by an Engineer or Architect in accordance with ACI 530.1/ASCE 6.", "9. Where anchor bolts, wedge anchors or anchors set in epoxy are set in a masonry wall, fill cells with grout for bolted course, one course above and | two courses below.", "10. Provide lintels or headers with min. 8\" bearing over all masonry openings.", "11. Use pressure-treated wood for wood in contact with masonry."]}]}, {"heading": "DEMOLITION NOTES", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 8, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. At all locations where new construction will interface with existing elements, cut through existing structure in straight and true lines to insure a | neat interface.", "2. At all locations where the demolition of a concrete member leaves the ends of reinforcing steel exposed, provide the following:", "a. Chip concrete from around the steel to a depth of 1\".", "b. Cut off reinforcing steel not less than 3/4\" below the concrete surface.", "c. Fill the cavity flush with a high modulus gel epoxy. See specifications for accepted manufacturers.", "3. Before demolishing any structural element, install all required temporary and/or permanent bracing and supports.", "4. Provide temporary closure of all roof fascia, wall and other openings to protect building from exposure to undesirable elements until new | construction is weatherproofed, at which time such temporary construction shall be removed. All temporary exterior walls that are subject to wind loads are to be designed by a {state} Licensed Delegated Engineer.", "5. Upon completion of new construction under each phase, all demolished areas shall be restored to acceptable usage according to the contract | documents as determined by the Architect or Engineer."]}]}, {"heading": "STRUCTURAL STEEL", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 10, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. Fabricate and erect structural steel in conformance with AISC \"Specification for Structural Steel Buildings\", with Commentary, AISC “Code of Standard Practice for Steel Buildings and Bridges”, AISC “Specification for Structural Joints Using ASTM A325 and A490 Bolts, including Commentary” and all OSHA requirements.", "2. Submit, to the Architect, complete fabrication and erection drawings prepared by or under the direct supervision of a {state} licensed engineer | (Delegated Engineer). Details or connections changed or proposed by the fabricator shall be signed, sealed and dated by the Delegated Engineer.", "3. Fabricate structural steel shapes from the following materials:", "a. Plates: ASTM A36.", "4. All shop and field welding procedures and personnel shall conform to AWS D1.1 Structural Welding Code- Steel. Use E70 series welding | electrodes, u.o.n. Where necessary, remove galvanizing or primer prior to welding.", "5. Cut, drill, or punch holes perpendicular to metal surfaces. Ream holes that must be enlarged to admit bolts as permitted by Architect. Do not | enlarge unfair holes by burning or using drift pins.", "6. Do not splice structural steel members except where indicated on the drawings.", "7. Steel erector to furnish and install temporary bracing as necessary to provide a stable structure during construction.", "8. See Architectural and Mechanical Drawings for miscellaneous steel not shown on the Structural Drawings.", "9. Refer to Architectural Drawings for painting and fireproofing of structural steel. In the absence of other instructions, paint all non-galvanized steel | with a lead and chromate free steel primer. Do not paint steel surfaces in contact with concrete or to be fireproofed."]}]}, {"heading": "SHALLOW FOUNDATIONS", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 2, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. As per visual inspection soil conditions at this site are sand & rock with a min bearing capacity of {year} psf should other conditions or materials be encountered, the engineer shall be notified prior to proceeding with the work the architect or engineer shall supply a letter attesting that the site has been observed and the foundation conditions are similar to those upon which the design is based on.", "2. Center all footings under their respective columns or walls, u.o.n."]}]}, {"heading": "EXCAVATION, BACKFILL AND DEWATERING", "kind": "notes", "sets": 1, "pct": 50.0, "tier": "common", "items_median": 3, "on_sheets": ["structural_notes"], "wordings": 1, "variants": [{"sets": 1, "items": ["1. The Contractor is solely responsible for all excavation procedures including lagging, shoring, and protection of adjacent property, structures, | streets and utilities in accordance with the requirements of the local building department and OSHA regulations. Do not excavate within one foot of the angle of repose of any soil bearing foundation unless the foundation is properly protected against settlement.", "2. Do not backfill against walls until 7 days after the walls are braced by the structure or are temporarily braced. Do not backfill cantilevered | re
